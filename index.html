<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Format Forge</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <aside class="format-sidebar" aria-label="图片类型">
        <section class="format-section">
          <button class="sidebar-section-title" id="format-section-toggle" aria-expanded="true" aria-controls="format-nav">图片<span class="format-section-indicator" aria-hidden="true"></span></button>
          <nav class="format-nav" id="format-nav"></nav>
        </section>
      </aside>
      <section class="workspace">
        <div class="workspace-actions">
          <button class="action-button" id="clear-button" title="清空文件" aria-label="清空文件">&#215;</button>
        </div>
        <div class="file-list" id="file-list" aria-live="polite"></div>
        <footer class="conversion-bar">
          <div class="compression-mode" id="compression-mode" aria-label="压缩模式">
            <span class="compression-mode-indicator" aria-hidden="true"></span>
            <button class="compression-mode-button is-active" type="button" data-compression-mode="lossy">有损</button>
            <button class="compression-mode-button" type="button" data-compression-mode="lossless">无损</button>
          </div>
          <input id="quality-input" type="range" min="0" max="100" value="88" aria-label="图片质量" />
          <output id="quality-value">88</output>
          <span id="file-count">0</span>
          <button class="convert-button" id="convert-button" disabled title="选择导出路径" aria-label="选择导出路径"><span>选择路径</span><span aria-hidden="true">&#8594;</span></button>
        </footer>
      </section>
      <aside class="task-queue" aria-label="任务队列">
        <header class="task-queue-header">
          <span>任务队列</span>
          <span id="queue-progress">0/0</span>
        </header>
        <div class="task-queue-list" id="task-queue-list" aria-live="polite"></div>
      </aside>
      <button class="message-bar" id="status-message" type="button" title="打开日志文件夹" aria-label="打开日志文件夹" aria-live="polite">准备就绪</button>
    </main>
    <dialog class="crop-dialog" id="ico-crop-dialog" aria-labelledby="ico-crop-title">
      <form method="dialog" class="crop-dialog-content">
        <header class="crop-dialog-header">
          <div>
            <h2 id="ico-crop-title">裁剪为 ICO 图标</h2>
            <p id="ico-crop-file"></p>
          </div>
          <button class="crop-close-button" id="ico-crop-cancel" type="button" title="取消 ICO 转换" aria-label="取消 ICO 转换">&#215;</button>
        </header>
        <div class="crop-stage" id="ico-crop-stage">
          <img id="ico-crop-image" alt="待裁剪图片" />
          <div class="crop-selection" id="ico-crop-selection" aria-label="裁剪区域"><span class="crop-handle crop-handle-x" aria-hidden="true"></span><span class="crop-handle crop-handle-y" aria-hidden="true"></span><span class="crop-handle crop-handle-corner" aria-hidden="true"></span></div>
        </div>
        <fieldset class="ico-size-options" aria-label="ICO 输出分辨率">
          <legend>输出分辨率</legend>
          <label><input type="radio" name="ico-size" value="16" />16 px</label>
          <label><input type="radio" name="ico-size" value="32" />32 px</label>
          <label><input type="radio" name="ico-size" value="64" />64 px</label>
          <label><input type="radio" name="ico-size" value="256" checked />256 px</label>
        </fieldset>
        <footer class="crop-dialog-actions">
          <span id="ico-crop-progress"></span>
          <button class="crop-confirm-button" id="ico-crop-confirm" type="button">下一张</button>
        </footer>
      </form>
    </dialog>
  </body>
</html>
